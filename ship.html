<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Add parcel tracking – Aura HomeSystems</title>
    <script src="inquiry-config.js"></script>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #0b1220; color: #e5e7eb; }
      main { max-width: 520px; margin: 0 auto; padding: 32px 20px 64px; }
      a { color: #86efac; }
      h1 { font-size: 1.6rem; margin: 12px 0; }
      p { line-height: 1.5; }
      form { display: flex; flex-direction: column; gap: 12px; background: #0f172a; border: 1px solid rgba(148,163,184,.35); border-radius: 16px; padding: 18px; }
      label { display: flex; flex-direction: column; gap: 6px; }
      input, select { min-height: 48px; border-radius: 12px; border: 1px solid rgba(148,163,184,.45); background: #f1f5f9; color: #0f172a; padding: 0 14px; font-size: 1rem; }
      input[readonly] { background: #e2e8f0; color: #334155; }
      button { min-height: 48px; border: 0; border-radius: 12px; background: #22c55e; color: #022c22; font-weight: 700; font-size: 1rem; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      .muted { color: #cbd5e1; }
      .current { margin: 0; padding: 12px 14px; border-radius: 12px; background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.45); color: #bbf7d0; font-weight: 650; }
      .error { color: #fecaca; }
      .ok { color: #4ade80; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <a href="index.html">Aura HomeSystems</a>
      <h1>Add parcel tracking</h1>
      <p class="muted">Open this page from the link in the order email. The green line shows the last status you saved. Paste the Speedy, Ekont, post or DHL number when the parcel leaves. When the customer has it, use the second button.</p>
      <form id="shipForm">
        <p id="shipCurrent" class="current">Loading the last saved status…</p>
        <label>Order
          <input id="orderInput" name="order" required readonly />
        </label>
        <label>Courier
          <select id="carrierInput" name="carrier" required>
            <option value="speedy">Speedy</option>
            <option value="econt">Ekont</option>
            <option value="bgpost">Bulgarian Post</option>
            <option value="dhl">DHL</option>
            <option value="ups">UPS</option>
            <option value="link">Other — paste the full https link</option>
          </select>
        </label>
        <label>Tracking number or link
          <input id="numberInput" name="trackingNumber" required autocomplete="off" />
        </label>
        <button type="submit">Save tracking number</button>
        <button type="button" id="deliveredBtn">The customer has received the parcel</button>
        <p id="shipMessage" hidden></p>
      </form>
    </main>
    <script>
      var params = new URLSearchParams(location.search);
      var order = params.get("order") || "";
      var token = params.get("token") || "";
      document.getElementById("orderInput").value = order;
      var message = document.getElementById("shipMessage");
      var current = document.getElementById("shipCurrent");
      var carrierInput = document.getElementById("carrierInput");
      var numberInput = document.getElementById("numberInput");
      var saveButton = document.querySelector("#shipForm button[type=submit]");
      var deliveredButton = document.getElementById("deliveredBtn");
      function paintStatus(data) {
        var status = data && data.status;
        var text = "Last status: Being prepared. The tracking number is not saved yet.";
        if (data && data.carrier && carrierInput.querySelector('option[value="' + data.carrier + '"]')) carrierInput.value = data.carrier;
        if (data && data.trackingNumber) numberInput.value = data.trackingNumber;
        var locked = status === "delivered";
        carrierInput.disabled = locked;
        numberInput.disabled = locked;
        saveButton.disabled = locked;
        deliveredButton.disabled = locked;
        if (status === "delivered") {
          text = "Last status: Delivered" + (data.deliveredAt ? " on " + data.deliveredAt : "") + ". You already marked that the customer has the parcel.";
        } else if (status === "shipped") {
          text = "Last status: Handed to " + (data.carrierLabel || "the courier") + (data.shippedAt ? " on " + data.shippedAt : "") + (data.trackingNumber ? ". Tracking number " + data.trackingNumber : "") + ".";
        }
        current.textContent = text;
      }
      function loadStatus() {
        if (!order || !token) {
          current.textContent = "Open the link from the order email. It contains the private key for this order.";
          return;
        }
        var base = (window.INQUIRY_FUNCTIONS_BASE_URL || "").replace(/\/$/, "");
        fetch(base + "/api/order-ship?order=" + encodeURIComponent(order) + "&token=" + encodeURIComponent(token))
          .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
          .then(function (result) {
            if (!result.ok) {
              current.textContent = (result.data && result.data.error) || "The last status could not be loaded. Deploy cleverhaus on Render, then open this link again.";
              return;
            }
            paintStatus(result.data);
          })
          .catch(function () {
            current.textContent = "The last status could not be loaded. Deploy cleverhaus on Render, then open this link again.";
          });
      }
      loadStatus();
      document.getElementById("deliveredBtn").addEventListener("click", function () {
        message.hidden = true;
        if (!token) {
          message.textContent = "Open the link from the order email. It contains the private key for this order.";
          message.className = "error";
          message.hidden = false;
          return;
        }
        var base = (window.INQUIRY_FUNCTIONS_BASE_URL || "").replace(/\/$/, "");
        fetch(base + "/api/order-ship", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "delivered",
            orderId: order,
            token: token
          })
        }).then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
          .then(function (result) {
            message.className = result.ok ? "ok" : "error";
            message.textContent = result.ok
              ? "Status is now: Delivered."
              : ((result.data && result.data.error) || "Could not save it.");
            message.hidden = false;
            if (result.ok) loadStatus();
          })
          .catch(function () {
            message.className = "error";
            message.textContent = "The server did not answer. Deploy cleverhaus on Render first.";
            message.hidden = false;
          });
      });
      document.getElementById("shipForm").addEventListener("submit", function (event) {
        event.preventDefault();
        message.hidden = true;
        if (!token) {
          message.textContent = "Open the link from the order email. It contains the private key for this order.";
          message.className = "error";
          message.hidden = false;
          return;
        }
        var base = (window.INQUIRY_FUNCTIONS_BASE_URL || "").replace(/\/$/, "");
        fetch(base + "/api/order-ship", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            orderId: order,
            token: token,
            carrier: document.getElementById("carrierInput").value,
            trackingNumber: document.getElementById("numberInput").value.trim()
          })
        }).then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
          .then(function (result) {
            message.className = result.ok ? "ok" : "error";
            message.textContent = result.ok
              ? "Status is now: In the transport warehouse."
              : ((result.data && result.data.error) || "Could not save it.");
            message.hidden = false;
            if (result.ok) loadStatus();
          })
          .catch(function () {
            message.className = "error";
            message.textContent = "The server did not answer. If this is a new order, deploy cleverhaus on Render first.";
            message.hidden = false;
          });
      });
    </script>
  </body>
</html>
