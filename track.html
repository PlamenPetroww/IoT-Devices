<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Track an order – Aura HomeSystems</title>
    <meta name="description" content="See when your Aura HomeSystems order should arrive and follow the courier tracking after it ships." />
    <link rel="canonical" href="https://aurahomesystems.eu/track.html" />
    <script src="inquiry-config.js"></script>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #0b1220; color: #e5e7eb; }
      main { max-width: 520px; margin: 0 auto; padding: 32px 20px 64px; }
      a { color: #86efac; }
      h1 { font-size: 1.6rem; margin: 12px 0; }
      p { line-height: 1.5; }
      form, .card { display: flex; flex-direction: column; gap: 12px; background: #0f172a; border: 1px solid rgba(148,163,184,.35); border-radius: 16px; padding: 18px; }
      label { display: flex; flex-direction: column; gap: 6px; font-size: 0.95rem; }
      input { min-height: 48px; border-radius: 12px; border: 1px solid rgba(148,163,184,.45); background: #f1f5f9; color: #0f172a; padding: 0 14px; font-size: 1rem; }
      button { min-height: 48px; border: 0; border-radius: 12px; background: #22c55e; color: #022c22; font-weight: 700; font-size: 1rem; cursor: pointer; }
      [hidden] { display: none !important; }
      .muted { color: #cbd5e1; }
      .error { color: #fecaca; }
      ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
      ol.steps li { border-left: 3px solid #334155; padding: 0 0 2px 12px; }
      ol.steps li.done { border-color: #86efac; }
      ol.steps li.current { border-color: #22c55e; }
      ol.steps li.waiting { opacity: 0.72; }
      ol.steps h2 { margin: 0 0 4px; font-size: 1rem; }
      ol.steps p { margin: 0; }
      .track-link { margin-top: 8px; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; background: #22c55e; color: #022c22; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <a href="index.html">Aura HomeSystems</a>
      <h1>Track an order</h1>
      <p class="muted">Use the order number and the email from the order. The list shows where the order is: being prepared, then in the courier warehouse, then delivered.</p>
      <form id="trackForm">
        <label>Order number
          <input id="orderInput" name="order" autocomplete="off" required placeholder="AHS-7K2M" />
        </label>
        <label>Email
          <input id="emailInput" name="email" type="email" autocomplete="email" required placeholder="you@email.com" />
        </label>
        <button type="submit">Show delivery</button>
        <p id="trackError" class="error" hidden></p>
      </form>
      <section id="trackResult" class="card" hidden>
        <p id="trackOrder"></p>
        <p id="trackProduct"></p>
        <ol id="trackSteps" class="steps"></ol>
        <p id="trackEta" class="muted"></p>
      </section>
    </main>
    <script>
      var params = new URLSearchParams(location.search);
      if (params.get("order")) document.getElementById("orderInput").value = params.get("order");
      var form = document.getElementById("trackForm");
      var errorEl = document.getElementById("trackError");
      var resultEl = document.getElementById("trackResult");
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        errorEl.hidden = true;
        resultEl.hidden = true;
        var base = (window.INQUIRY_FUNCTIONS_BASE_URL || "").replace(/\/$/, "");
        var order = document.getElementById("orderInput").value.trim();
        var email = document.getElementById("emailInput").value.trim();
        fetch(base + "/api/order-status?order=" + encodeURIComponent(order) + "&email=" + encodeURIComponent(email), { cache: "no-store" })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (!data || !data.found) {
              errorEl.textContent = "No order found for that number and email.";
              errorEl.hidden = false;
              return;
            }
            document.getElementById("trackOrder").textContent = "Order " + data.orderId;
            document.getElementById("trackProduct").textContent = data.product || "";
            var country = "";
            if (data.country) {
              try { country = new Intl.DisplayNames(["en"], { type: "region" }).of(data.country) || data.country; } catch (e) { country = data.country; }
            }
            var eta = document.getElementById("trackEta");
            eta.textContent = data.etaFrom && data.etaTo
              ? "Expected arrival" + (country ? " in " + country : "") + ": " + data.etaFrom + " – " + data.etaTo + "."
              : "";
            var steps = Array.isArray(data.steps) ? data.steps : [];
            var list = document.getElementById("trackSteps");
            list.innerHTML = "";
            steps.forEach(function (step) {
              var item = document.createElement("li");
              item.className = step.state || "waiting";
              var title = document.createElement("h2");
              title.textContent = step.title || "";
              var detail = document.createElement("p");
              detail.textContent = step.detail || "";
              item.appendChild(title);
              item.appendChild(detail);
              if (step.trackingUrl) {
                var link = document.createElement("a");
                link.className = "track-link";
                link.href = step.trackingUrl;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "Open " + (data.carrierLabel || "courier") + " tracking";
                item.appendChild(link);
              }
              list.appendChild(item);
            });
            resultEl.hidden = false;
          })
          .catch(function () {
            errorEl.textContent = "The tracking page could not reach the server. Try again in a minute.";
            errorEl.hidden = false;
          });
      });
    </script>
  </body>
</html>
